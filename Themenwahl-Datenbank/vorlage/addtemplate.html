<div class="tw-formular">
  <h3 class="tw-titel">Wähle dein Thema</h3>
  <p class="tw-text">
    Pro Thema gibt es <strong><span class="tw-plaetze">5</span> Plätze</strong>.
    Volle Themen sind ausgegraut. Wer zuerst speichert, hat den Platz.
  </p>

  <div class="tw-feld">
    <p class="tw-legende">Thema <span class="tw-pflicht">(Pflichtfeld)</span></p>
    <div id="tw-thema-wahl">[[Thema]]</div>
  </div>

  <div class="tw-feld">
    <label class="tw-legende" for="[[Wunschteam#id]]">Mit wem möchtest du zusammenarbeiten? <span class="tw-optional">(freiwillig)</span></label>
    [[Wunschteam]]
    <p class="tw-hilfe">Namen eintragen, z.&nbsp;B. „Lena, Tim“. Wer zusammenarbeiten möchte, wählt am besten dasselbe Thema.</p>
  </div>
</div>
